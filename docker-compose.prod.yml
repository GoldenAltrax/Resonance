# Production: Caddy (HTTPS) in front of the Resonance app.
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: resonance-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RESONANCE_HOST=${RESONANCE_HOST:-minecraft.tail93f9bc.ts.net}
      - PUBLIC_HOST=${PUBLIC_HOST:-public.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Lets Caddy fetch the Tailscale HTTPS certificate for the *.ts.net hostname
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    depends_on:
      - resonance
    networks:
      - resonance-network

  resonance:
    build: .
    container_name: resonance-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data:/app/backend/data
      - ./uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/backend/data/resonance.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_URL=https://${RESONANCE_HOST:-minecraft.tail93f9bc.ts.net}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-2}
      - ITUNES_COUNTRY=${ITUNES_COUNTRY:-US}
      - YTDLP_ARGS=${YTDLP_ARGS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-claude-haiku-5-5}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - resonance-network

  # Public access through a Cloudflare Tunnel (no open ports on the router).
  # Only starts with COMPOSE_PROFILES=public and CLOUDFLARE_TUNNEL_TOKEN set in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: resonance-cloudflared
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - caddy
    networks:
      - resonance-network

networks:
  resonance-network:
    driver: bridge

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
